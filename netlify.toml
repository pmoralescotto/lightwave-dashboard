[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[functions]]
  name = "update-summary"
  schedule = "0 14 * * 1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
